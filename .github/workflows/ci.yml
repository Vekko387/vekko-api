name: API CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_PREFIX: api/v1
      CORS_ORIGINS: ''
      DATABASE_URL: postgresql://vekko:vekko_ci@127.0.0.1:5432/vekko_test
      DEPENDENCY_HEALTH_TIMEOUT_MS: 2000
      FIREBASE_CLIENT_EMAIL: firebase-admin-test@vekko-test.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: not-used-because-firebase-is-mocked-in-tests
      FIREBASE_PROJECT_ID: vekko-test
      FIREBASE_WEB_API_KEY: not-used-because-firebase-is-mocked-in-tests
      NODE_ENV: test
      REDIS_CONNECT_TIMEOUT_MS: 5000
      REDIS_KEY_PREFIX: vekko:ci
      REDIS_URL: redis://127.0.0.1:6379/1
      THROTTLE_LIMIT: 100
      THROTTLE_TTL_MS: 60000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vekko_test
          POSTGRES_PASSWORD: vekko_ci
          POSTGRES_USER: vekko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vekko -d vekko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: corepack pnpm prisma:validate

      - name: Apply database migrations
        run: corepack pnpm prisma:migrate:deploy

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test --runInBand

      - name: Integration tests
        run: corepack pnpm test:e2e --runInBand

      - name: Build
        run: corepack pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          git --redact --no-banner --verbose /repo
